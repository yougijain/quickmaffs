<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Mint glyph gradient: brand.soft (top) -> brand.DEFAULT (bottom) -->
    <linearGradient id="mint" x1="512" y1="300" x2="512" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fe8b4"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
    <!-- Subtle center glow -->
    <radialGradient id="glow" cx="512" cy="480" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#3ddc97" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <!-- Very slight vertical depth on the tile -->
    <linearGradient id="tile" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E1211"/>
      <stop offset="1" stop-color="#080A09"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (iOS masks the corners itself; no transparency) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#glow)"/>

  <!-- Long-shadow behind the glyph for subtle depth -->
  <g transform="translate(26 30)" opacity="0.22">
    <rect x="286" y="479" width="452" height="66" rx="33" fill="#000000"/>
    <line x1="398" y1="700" x2="628" y2="360" stroke="#000000" stroke-width="74" stroke-linecap="round"/>
  </g>

  <!-- The mark: horizontal bar crossed by a diagonal slash with a rounded cap -->
  <g>
    <rect x="286" y="479" width="452" height="66" rx="33" fill="url(#mint)"/>
    <line x1="398" y1="700" x2="628" y2="360" stroke="url(#mint)" stroke-width="74" stroke-linecap="round"/>
  </g>
</svg>
